version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Skip PR builds that don't touch the docs (exit 183 = cancel build)
      - if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- cds_docs_femhealth/; then exit 183; fi
sphinx:
  configuration: cds_docs_femhealth/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: cds_docs_femhealth/requirements.txt
